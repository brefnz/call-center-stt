<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Demo Halaman Ticketing + Sidebar KB</title>
  <style>
    body { margin: 0; display: flex; font-family: system-ui, sans-serif; }
    .main-content { flex: 1; padding: 20px; background: #fafafa; }
    .right-sidebar { width: 320px; border-left: 1px solid #ddd; background: #fff; min-height: 100vh; }
  </style>
</head>
<body>
  <!-- Ini merepresentasikan halaman ticketing CRM Data Kelola yang sudah ada -->
  <div class="main-content">
    <h2>Halaman Ticketing (CRM Data Kelola)</h2>
    <p>Konten form ticketing yang sudah ada tetap di sini seperti biasa.</p>
  </div>

  <!-- INI YANG DITAMBAHKAN: sidebar kanan buat saran KB -->
  <div class="right-sidebar">
    <div id="kb-sidebar"></div>
  </div>

  <script src="kb-sidebar-widget.js"></script>
  <script>
    // backendBaseUrl dipakai dari origin halaman ini sendiri (window.location.origin)
    // -- karena halaman ini di-serve LANGSUNG oleh backend FastAPI (lihat
    // app/main.py: app.mount("/demo", ...)), origin-nya otomatis SAMA PERSIS
    // dengan backend. Tidak perlu ganti-ganti host manual lagi, dan tidak
    // ada resiko mixed content (http vs https) karena keduanya satu origin.
    //
    // Kalau nanti widget ini dipasang di CRM yang benar-benar terpisah
    // domainnya dari backend, baru backendBaseUrl perlu diisi manual ke
    // URL backend production (dan pastikan skema https/wss-nya cocok).
    KbSidebarWidget.init({
      containerId: "kb-sidebar",
      backendBaseUrl: window.location.origin,
      agentExtension: "202", // ganti: ambil dari sesi login agent yang sedang aktif di CRM
    });
  </script>
</body>
</html>
