; Contoh snippet untuk /etc/asterisk/extensions_custom.conf
;
; Ide dasarnya: begitu channel masuk (inbound) SEBELUM di-route ke queue/agent
; (atau di leg agent setelah dijawab, tergantung kebutuhan), channel "mampir"
; sebentar ke Stasis(stt-kb) supaya aplikasi kita bisa memasang snoop channel.
; Setelah snoop terpasang, aplikasi memanggil /channels/{id}/continue lewat ARI
; sehingga channel otomatis lanjut ke priority berikutnya di dialplan ini -
; jadi panggilan tetap diproses normal oleh FreePBX (tidak ada gangguan ke
; agent atau customer).
;
; Cara pakai di FreePBX: buat "Custom Destination" yang menunjuk ke
; context ini (from-stt-kb-hook,s,1), lalu di Inbound Route pilih Custom
; Destination tsb SEBELUM diarahkan ke Ring Group/Queue yang sesungguhnya
; -- atau, kalau ingin lebih presisi menyadap leg AGENT saja, pasang hook
; serupa di "Set Music on Hold Class" step / dial option `b(...)` pada Queue.

[from-stt-kb-hook]
exten => s,1,NoOp(STT+KB hook aktif untuk channel ${CHANNEL})
 same => n,Stasis(stt-kb)
 ; Setelah ARI app memanggil /channels/{id}/continue, eksekusi lanjut di sini:
 same => n,NoOp(Kembali dari Stasis, lanjut ke routing normal)
 same => n,Goto(from-internal,${EXTEN_ASLI_TUJUAN},1) ; sesuaikan target routing Anda
